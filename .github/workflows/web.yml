# The WebAssembly build is a required check.
#
# Emscripten's clang rejects things MSVC accepts. An implicit function
# declaration is a warning on Windows and a hard error here. Without this
# job, a PR can be green on all three native platforms and still break the
# browser build completely. That has happened, which is why this file exists.
name: Web (WebAssembly)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: Emscripten build
    runs-on: ubuntu-latest
    env:
      FFMPEG_VERSION: 7.1.1
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        id: emsdk
        run: |
          emcc --version
          echo "version=$(emcc -dumpversion)" >> "$GITHUB_OUTPUT"

      # The Bink decoder for the menu doors and the reels, built once
      # per FFmpeg version, Emscripten version and configure line, and
      # the installed prefix cached on those.
      - name: Cache FFmpeg for the browser
        uses: actions/cache@v6
        with:
          path: build-ffmpeg-wasm
          key: ffmpeg-wasm-${{ env.FFMPEG_VERSION }}-emsdk-${{ steps.emsdk.outputs.version }}-${{ hashFiles('scripts/build-ffmpeg-wasm.sh') }}

      - name: Build FFmpeg for the browser
        run: scripts/build-ffmpeg-wasm.sh --prefix build-ffmpeg-wasm --version "$FFMPEG_VERSION"

      # No game data is bundled: with no TAK_GAME_DIR the build configures
      # itself engine-only (TAK_WASM_BUNDLE_DATA=OFF). See docs/ASSETS.md.
      # The extra find root is where CMake finds the decoder.
      - name: Configure
        run: |
          emcmake cmake -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_FIND_ROOT_PATH="$PWD/build-ffmpeg-wasm"

      # A page that configured without the decoder would still build
      # and pass everything below, with every clip a still.
      - name: The browser build carries the Bink decoder
        run: |
          for lib in avcodec avformat swscale; do
            grep -q "^$(echo $lib | tr a-z A-Z)_LIBRARY:FILEPATH=.*/build-ffmpeg-wasm/lib/lib$lib\.a\$" build-wasm/CMakeCache.txt \
              || { echo "::error::lib$lib not found by the configure"; exit 1; }
          done

      - name: Build
        run: cmake --build build-wasm --parallel --target tak-re test_trig test_sim_probe test_click_map test_camera3d

      # The browser is one of the platforms a room holds together, so
      # it has to reach the same bits from the same arithmetic. The
      # hash is pinned in src/core/test_trig.c and every other
      # platform asserts the same one.
      - name: The browser agrees on the simulation's trigonometry
        run: node build-wasm/src/test_trig.js

      # The 3D view's pointer has to land on the same ground in a
      # browser tab as on the desktop. Pinned in numbers, no data.
      - name: The browser agrees on the 3D camera
        run: node build-wasm/src/test_camera3d.js

      # And the whole simulation, not only the arithmetic under it: a
      # synthetic battle through the real mover and the real combat
      # path, hashed and pinned. This is what lets a browser player and
      # a desktop player sit in the same room.
      - name: The browser agrees on the simulation
        run: node build-wasm/src/test_sim_probe.js

      # ctest does not run here, so the guard that keeps libm out of the
      # simulation runs on its own. It reads source text, so the native
      # jobs checking the whole list is what matters and this is the
      # two files that carry the angles, checked where a browser change
      # would land first.
      - name: The simulation carries its own trigonometry
        run: |
          cmake -DFILES="src/render/units.c|include/tak_math.h" -P cmake/libm_guard.cmake

      # A click lands on the same world pixel in the browser as on the
      # desktop: the window to canvas, window to world and pointer to
      # ground arithmetic, pinned in numbers over a range of window
      # sizes and pixel ratios (src/ui/test_click_map.c).
      - name: The browser puts a click where the desktop does
        run: node build-wasm/src/test_click_map.js

      # A map fingerprint has to come out the same in the browser as it
      # does natively, or matched players would be told their maps differ.
      - name: Map fingerprint check
        run: bash scripts/fingerprint-wasm-check.sh

      - name: Check bundle size
        run: |
          echo "Artifacts:"
          find build-wasm -name '*.wasm' -o -name '*.js' | while read -r f; do
            printf '%8.1f KB  %s\n' "$(echo "scale=1; $(stat -c%s "$f")/1024" | bc)" "$f"
          done
          # The engine alone should be small. A large artifact usually means
          # game data got bundled, which must never happen in a public build.
          for f in $(find build-wasm -name '*.data'); do
            echo "::error file=$f::Data bundle present in web build. Game content must not be packaged."
            exit 1
          done

      # Where the game server is. The address lives in a repository
      # variable and nowhere in this tree: the page cannot be served by
      # the relay, because GitHub Pages holds no socket open, so the page
      # reads one line out of relay.txt beside it. With the variable unset
      # nothing is written and the page falls back to its own origin.
      - name: Assemble site
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          mkdir -p site
          cp build-wasm/src/tak-re.html site/index.html
          cp build-wasm/src/tak-re.js build-wasm/src/tak-re.wasm site/
          # The page's backdrop, the picker's scroll plates and the custom
          # domain for GitHub Pages.
          cp docs/img/banner.jpg site/banner.jpg
          cp web/scroll-pick.jpg web/scroll-ready.jpg site/
          cp web/favicon.png web/og.jpg site/
          # Installing the site as an app, and the cache that makes a
          # return visit start at once.
          cp web/sw.js web/manifest.webmanifest web/icon-192.png web/icon-512.png site/
          # The leaderboard page. It reads the same relay.txt for where
          # the game server is and asks it over https.
          cp web/leaderboard.html site/leaderboard.html
          cp web/CNAME site/CNAME
          [ -n "$RELAY_URL" ] && printf '%s\n' "$RELAY_URL" > site/relay.txt || true
          ls -la site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The engine page on GitHub Pages. It holds no game data. Players point
  # it at their own copy of the game in the browser (see docs/ASSETS.md).
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
