name: Release

# Tag a release and this builds the desktop game for Windows, macOS and
# Linux and attaches the archives to it:
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# No game content is ever packaged. The archives hold this engine and
# the SDL runtime it needs; the player brings their own copy of the
# original, which the binary finds at run time. See docs/ASSETS.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Leave the release as a draft'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # The tag names the version players will report in a bug, so it has to
  # be the version the binary shows. Cheap to check, and wrong once the
  # archives are published.
  version:
    name: Tag matches the project version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: pick
        run: |
          project=$(sed -n 's/^ *VERSION \([0-9.]*\) *$/\1/p' CMakeLists.txt | head -1)
          if [ -z "$project" ]; then
            echo "::error::No VERSION found in CMakeLists.txt"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            if [ "${tag#v}" != "$project" ]; then
              echo "::error::Tag $tag and project version $project disagree. Bump project() in CMakeLists.txt or retag."
              exit 1
            fi
          fi
          echo "version=$project" >> "$GITHUB_OUTPUT"
          echo "Building $project"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            slug: windows-x64
          # Built on the oldest runner still supported, so the binary
          # asks for an older glibc and runs on more distributions.
          - name: Linux x86_64
            os: ubuntu-22.04
            slug: linux-x86_64
          # Apple silicon only. GitHub has retired its Intel macOS
          # runners, and a job asking for one waits for a machine that
          # never comes. An Intel Mac builds from source, see the README.
          - name: macOS arm64
            os: macos-latest
            slug: macos-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the build stamp is git describe

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev patchelf nasm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja nasm

      # Homebrew's sdl2 is sdl2-compat, an SDL2 API over SDL3 that loads
      # libSDL3 at run time. Bundling it ships a shim with nothing to
      # shim onto, and the game cannot start on a machine that has no
      # SDL3 of its own. Build the real SDL2, the version vcpkg gives
      # the Windows build.
      - name: Build SDL2 (macOS)
        if: runner.os == 'macOS'
        env:
          SDL_VERSION: 2.32.10
        run: |
          curl -fsSL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          tar xzf sdl.tar.gz
          cmake -S "SDL2-${SDL_VERSION}" -B sdlbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdlroot"
          cmake --build sdlbuild --parallel
          cmake --install sdlbuild

      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: build/vcpkg_installed
          key: vcpkg-release-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      # The menu doors and the intro are Bink video, and a build with no
      # decoder shows them still. Only the Bink decoder is enabled, so
      # this is small, needs nothing else installed, and pulls in no
      # other codec's licence. Static, so the archive gains no files.
      - name: Build FFmpeg (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          FFMPEG_VERSION: 7.1.1
        run: |
          set -e
          curl -fsSL -o ff.tar.gz \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.gz"
          tar xzf ff.tar.gz
          cd "ffmpeg-${FFMPEG_VERSION}"
          ./configure --prefix="$GITHUB_WORKSPACE/ffroot" \
            --disable-everything --disable-programs --disable-doc \
            --disable-network --disable-autodetect --disable-debug \
            --disable-shared --enable-static --enable-pic \
            --disable-avdevice --disable-avfilter --disable-postproc \
            --enable-decoder=bink --enable-demuxer=bink \
            --enable-protocol=file
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install

      # No TAK_GAME_DIR: a release binary carries no build machine path
      # and finds the player's own copy at run time.
      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$PWD/sdlroot;$PWD/ffroot"
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$PWD/ffroot"
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      # The data-free suite. The rest needs the player's own game files,
      # which no runner has, and runs locally before a tag is cut.
      - name: Test (data-free subset)
        run: ctest --test-dir build -C Release --output-on-failure --label-exclude needs-data

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          stage=stage/OpenKingdoms
          mkdir -p "$stage"
          cp build/src/Release/tak-re.exe "$stage/OpenKingdoms.exe"
          # vcpkg puts every dependent DLL beside the binary: SDL and the
          # FFmpeg libraries the Bink clips are decoded with.
          cp build/src/Release/*.dll "$stage/"
          # The C runtime is not part of Windows. A machine that has
          # never installed a Visual C++ redistributable has no
          # vcruntime140.dll, and the game would not start.
          crt=$(find "/c/Program Files/Microsoft Visual Studio" \
                  -name vcruntime140.dll -path "*x64*" 2>/dev/null | tail -1)
          [ -n "$crt" ] || crt=/c/Windows/System32/vcruntime140.dll
          cp "$crt" "$stage/"
          cp README.md LICENSE "$stage/"
          cp .github/release/THIRD-PARTY.txt "$stage/"
          cp docs/ASSETS.md "$stage/ASSETS.md"
          cp .github/release/HOW-TO-RUN.txt "$stage/"
          cd stage
          7z a -tzip "../openkingdoms-${{ needs.version.outputs.version }}-${{ matrix.slug }}.zip" OpenKingdoms

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          stage=stage/OpenKingdoms
          mkdir -p "$stage"
          cp build/src/tak-re "$stage/OpenKingdoms"
          # Ship the SDL we linked against, and look for it beside the
          # binary, so the archive needs nothing installed.
          sdl=$(ldd build/src/tak-re | awk '/libSDL2/ {print $3}' | head -1)
          test -n "$sdl"
          cp "$sdl" "$stage/$(basename "$sdl")"
          patchelf --set-rpath '$ORIGIN' "$stage/OpenKingdoms"
          cp README.md LICENSE "$stage/"
          cp .github/release/THIRD-PARTY.txt "$stage/"
          cp docs/ASSETS.md "$stage/ASSETS.md"
          cp .github/release/HOW-TO-RUN.txt "$stage/"
          tar -C stage -czf "openkingdoms-${{ needs.version.outputs.version }}-${{ matrix.slug }}.tar.gz" OpenKingdoms

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          stage=stage/OpenKingdoms
          mkdir -p "$stage"
          cp build/src/tak-re "$stage/OpenKingdoms"
          sdl=$(otool -L build/src/tak-re | awk '/libSDL2/ {print $1}' | head -1)
          test -n "$sdl"
          base=$(basename "$sdl")
          # What the binary records is an install name, not always a path
          # on disk: SDL built from source records @rpath/<name>. Find the
          # file itself where the build put it.
          src="$sdl"
          if [ ! -f "$src" ]; then
            src=$(find "$PWD/sdlroot" -name "$base" -type f 2>/dev/null | head -1)
          fi
          if [ ! -f "$src" ]; then
            echo "::error::Cannot find $base on disk; the binary records $sdl"
            exit 1
          fi
          cp "$src" "$stage/$base"
          chmod u+w "$stage/$base"
          install_name_tool -change "$sdl" "@executable_path/$base" "$stage/OpenKingdoms"
          install_name_tool -id "@executable_path/$base" "$stage/$base"
          # An edited Mach-O has an invalid signature until it is signed
          # again, and arm64 refuses to run one.
          codesign --force --sign - "$stage/$base"
          codesign --force --sign - "$stage/OpenKingdoms"
          cp README.md LICENSE "$stage/"
          cp .github/release/THIRD-PARTY.txt "$stage/"
          cp docs/ASSETS.md "$stage/ASSETS.md"
          cp .github/release/HOW-TO-RUN.txt "$stage/"
          tar -C stage -czf "openkingdoms-${{ needs.version.outputs.version }}-${{ matrix.slug }}.tar.gz" OpenKingdoms

      # The build machine has every library the build needed, so
      # starting the game here says nothing about a player's machine.
      # sdl2-compat shipped a library that loads SDL3 at run time and
      # this step is what would have caught it. Check the archive
      # structurally: nothing in it may reach outside itself or the OS.
      - name: The archive depends on nothing outside itself
        shell: bash
        run: |
          set -e
          cd stage/OpenKingdoms
          if [ "${{ runner.os }}" = "Windows" ]; then
            have=$(ls | tr 'A-Z' 'a-z')
            missing=""
            # dumpbin is not on PATH without vcvars, and it is the only
            # thing here that can read an import table.
            dumpbin=$(find "/c/Program Files/Microsoft Visual Studio"                         -name dumpbin.exe -path "*Hostx64/x64*" 2>/dev/null | tail -1)
            if [ -z "$dumpbin" ]; then
              echo "::warning::No dumpbin, falling back to naming what must be here"
              for must in sdl2.dll vcruntime140.dll; do
                echo "$have" | grep -qx "$must" || missing="$missing $must"
              done
              if [ -n "$missing" ]; then
                echo "::error::Missing from the archive:$missing"; exit 1
              fi
              echo "the archive is self contained"
              exit 0
            fi
            for dep in $("$dumpbin" -dependents OpenKingdoms.exe \
                         | grep -oiE '[A-Za-z0-9_.-]+\.dll' | tr 'A-Z' 'a-z' | sort -u); do
              case "$dep" in
                api-ms-win-*|kernel32.dll|user32.dll|shell32.dll|ws2_32.dll|\
                advapi32.dll|ole32.dll|oleaut32.dll|gdi32.dll|winmm.dll|\
                imm32.dll|setupapi.dll|version.dll|dbghelp.dll|rpcrt4.dll) ;;
                *) echo "$have" | grep -qx "$dep" || missing="$missing $dep" ;;
              esac
            done
            if [ -n "$missing" ]; then
              echo "::error::Not in the archive and not part of Windows:$missing"
              exit 1
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            if grep -aq "Failed loading SDL3 library" libSDL2*.dylib; then
              echo "::error::The bundled SDL2 is sdl2-compat and wants an SDL3 that is not here."
              exit 1
            fi
            outside=$(otool -L OpenKingdoms libSDL2*.dylib \
                      | grep -oE '^\s+/[^ ]+' | tr -d '\t ' \
                      | grep -vE '^/usr/lib/|^/System/' || true)
            if [ -n "$outside" ]; then
              echo "::error::Points outside the archive: $outside"
              exit 1
            fi
            # An @rpath name resolves against a search path the archive
            # does not carry, so it is a dependency on the build machine
            # just as much as an absolute one.
            rpath=$(otool -L OpenKingdoms libSDL2*.dylib \
                    | grep -oE '@rpath/[^ ]+' || true)
            if [ -n "$rpath" ]; then
              echo "::error::Still resolved by rpath: $rpath"
              exit 1
            fi
          else
            for path in $(ldd OpenKingdoms | grep -oE '=> /[^ ]+' | cut -d' ' -f2); do
              case "$path" in
                "$PWD"/*|/lib/*|/lib64/*|/usr/lib/*) ;;
                *) echo "::error::$path is outside the archive"; exit 1 ;;
              esac
            done
          fi
          echo "the archive is self contained"

      # A packaged binary that cannot start is worse than no release, so
      # run the one thing that needs no game data: --help must print.
      - name: The packaged binary runs
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./stage/OpenKingdoms/OpenKingdoms.exe --help | head -3
          else
            ./stage/OpenKingdoms/OpenKingdoms --help | head -3
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: openkingdoms-${{ matrix.slug }}
          path: |
            openkingdoms-*.zip
            openkingdoms-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Notes
        run: |
          sed "s/VERSION_HERE/${{ needs.version.outputs.version }}/g" \
            .github/release/NOTES.md > notes.md
          cat notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}"
          draft=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            draft="--draft"
          fi
          gh release create "$tag" dist/* \
            --title "OpenKingdoms $tag" \
            --notes-file notes.md \
            $draft
