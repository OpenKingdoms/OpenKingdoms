<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="OpenTAK">
  <!-- Original artwork for OpenTAK, in the manner of a Carolingian
       illuminated page (gold on purple vellum, interlace borders,
       roundels). Licensed with the code (GPLv3). Reproduces no
       Cavedog/Atari art. -->
  <defs>
    <radialGradient id="vellum" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#f1e6cb"/>
      <stop offset="0.7" stop-color="#e2d2ad"/>
      <stop offset="1" stop-color="#c9b58a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7a6"/>
      <stop offset="0.45" stop-color="#d4af4b"/>
      <stop offset="1" stop-color="#8f6b1f"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6b1f"/>
      <stop offset="0.5" stop-color="#f7e7a6"/>
      <stop offset="1" stop-color="#8f6b1f"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a6e"/>
      <stop offset="1" stop-color="#3a1547"/>
    </linearGradient>
    <!-- interlace: two ribbons braiding over/under -->
    <pattern id="knot" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#3a1547"/>
      <path d="M-4 4 C12 4 12 20 24 20 S36 4 52 4" fill="none" stroke="#2a0f35" stroke-width="9"/>
      <path d="M-4 4 C12 4 12 20 24 20 S36 4 52 4" fill="none" stroke="#d4af4b" stroke-width="5"/>
      <path d="M-4 20 C12 20 12 4 24 4 S36 20 52 20" fill="none" stroke="#2a0f35" stroke-width="9"/>
      <path d="M-4 20 C12 20 12 4 24 4 S36 20 52 20" fill="none" stroke="#c23b2e" stroke-width="5"/>
      <!-- over-crossing patch so the gold ribbon reads as on top -->
      <path d="M14 12 C18 8 20 6 24 5" fill="none" stroke="#d4af4b" stroke-width="5"/>
    </pattern>
    <pattern id="knotV" width="24" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="48" height="24" fill="#3a1547"/>
      <path d="M-4 4 C12 4 12 20 24 20 S36 4 52 4" fill="none" stroke="#2a0f35" stroke-width="9"/>
      <path d="M-4 4 C12 4 12 20 24 20 S36 4 52 4" fill="none" stroke="#d4af4b" stroke-width="5"/>
      <path d="M-4 20 C12 20 12 4 24 4 S36 20 52 20" fill="none" stroke="#2a0f35" stroke-width="9"/>
      <path d="M-4 20 C12 20 12 4 24 4 S36 20 52 20" fill="none" stroke="#c23b2e" stroke-width="5"/>
      <path d="M14 12 C18 8 20 6 24 5" fill="none" stroke="#d4af4b" stroke-width="5"/>
    </pattern>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#2a1a05" flood-opacity="0.55"/>
    </filter>
    <!-- four-petal rosette for the medallions -->
    <g id="rosette">
      <circle r="21" fill="url(#purple)" stroke="url(#gold)" stroke-width="4"/>
      <path d="M0 -14 C6 -8 6 -2 0 0 C-6 -2 -6 -8 0 -14 Z M14 0 C8 6 2 6 0 0 C2 -6 8 -6 14 0 Z M0 14 C-6 8 -6 2 0 0 C6 2 6 8 0 14 Z M-14 0 C-8 -6 -2 -6 0 0 C-2 6 -8 6 -14 0 Z" fill="#d4af4b" stroke="#8f6b1f" stroke-width="1"/>
      <circle r="3" fill="#c23b2e"/>
    </g>
    <!-- acanthus curl -->
    <path id="acanthus" d="M0 0 C-14 -6 -22 -20 -12 -30 C-4 -38 8 -32 6 -22 C4 -16 -4 -16 -4 -22 M0 0 C8 -10 20 -10 26 -2 C30 4 26 12 18 12 C12 12 10 6 14 2" fill="none" stroke="#2f6b3a" stroke-width="3" stroke-linecap="round"/>
  </defs>

  <!-- vellum page -->
  <rect width="1200" height="320" fill="url(#vellum)"/>

  <!-- outer rule -->
  <rect x="16" y="16" width="1168" height="288" fill="none" stroke="#8f6b1f" stroke-width="2"/>
  <rect x="21" y="21" width="1158" height="278" fill="none" stroke="#d4af4b" stroke-width="3"/>

  <!-- interlace border bands -->
  <rect x="26" y="26" width="1148" height="24" fill="url(#knot)"/>
  <rect x="26" y="270" width="1148" height="24" fill="url(#knot)"/>
  <rect x="26" y="26" width="24" height="268" fill="url(#knotV)"/>
  <rect x="1150" y="26" width="24" height="268" fill="url(#knotV)"/>
  <rect x="26" y="26" width="1148" height="268" fill="none" stroke="#8f6b1f" stroke-width="1.5"/>
  <rect x="50" y="50" width="1100" height="220" fill="none" stroke="#8f6b1f" stroke-width="1.5"/>

  <!-- corner medallions -->
  <use href="#rosette" x="38" y="38"/>
  <use href="#rosette" x="1162" y="38"/>
  <use href="#rosette" x="38" y="282"/>
  <use href="#rosette" x="1162" y="282"/>

  <!-- illuminated initial: a square field with a Solomon's knot -->
  <g transform="translate(78,78)" filter="url(#ink)">
    <rect width="164" height="164" fill="url(#purple)" stroke="url(#gold)" stroke-width="5"/>
    <rect x="10" y="10" width="144" height="144" fill="none" stroke="#d4af4b" stroke-width="1.5"/>
    <g transform="translate(82,82)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- two interlocking loops -->
      <rect x="-52" y="-24" width="104" height="48" rx="24" stroke="#2a0f35" stroke-width="16"/>
      <rect x="-52" y="-24" width="104" height="48" rx="24" stroke="#d4af4b" stroke-width="10"/>
      <rect x="-24" y="-52" width="48" height="104" rx="24" stroke="#2a0f35" stroke-width="16"/>
      <rect x="-24" y="-52" width="48" height="104" rx="24" stroke="#c23b2e" stroke-width="10"/>
      <!-- over/under patches -->
      <path d="M-24 -18 V18" stroke="#d4af4b" stroke-width="10"/>
      <path d="M24 -18 V18" stroke="#d4af4b" stroke-width="10"/>
      <circle r="9" fill="#2f6b3a" stroke="#d4af4b" stroke-width="3"/>
    </g>
  </g>

  <!-- the purple field with the wordmark, gold on purple -->
  <g transform="translate(268,78)" filter="url(#ink)">
    <rect width="854" height="164" fill="url(#purple)" stroke="url(#gold)" stroke-width="5"/>
    <rect x="10" y="10" width="834" height="144" fill="none" stroke="#d4af4b" stroke-width="1.5"/>
    <use href="#acanthus" x="40" y="40" transform="scale(1)"/>
    <use href="#acanthus" x="814" y="40" transform="translate(1628,0) scale(-1,1)"/>
    <use href="#acanthus" x="40" y="128" transform="translate(0,256) scale(1,-1)"/>
    <use href="#acanthus" x="814" y="128" transform="translate(1628,256) scale(-1,-1)"/>
    <text x="427" y="104" text-anchor="middle"
          font-family="'Uncial Antiqua', 'Luminari', 'Palatino Linotype', Palatino, Georgia, serif"
          font-size="104" font-weight="bold" letter-spacing="6"
          fill="url(#goldH)" stroke="#2a0f35" stroke-width="1.5">OpenTAK</text>
    <path d="M120 128 H734" stroke="#d4af4b" stroke-width="2"/>
    <circle cx="427" cy="128" r="5" fill="#c23b2e" stroke="#d4af4b" stroke-width="1.5"/>
  </g>

  <!-- rubric beneath the field -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" text-anchor="middle">
    <text x="695" y="262" font-size="17" letter-spacing="4" fill="#8b1e14" font-variant="small-caps">an open-source engine for total annihilation: kingdoms</text>
  </g>
  <text x="160" y="261" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" letter-spacing="1.2" fill="#5a4630">BRING YOUR OWN GAME FILES</text>
</svg>
