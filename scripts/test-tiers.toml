[[tier1]]
name = "tools"
paths = ["tools/asset_validate.c", "tools/cob_inspect.c", "tools/map_inspect.c"]
ctest = "^(test_map_inspect|test_map_inspect_all|test_map_inspect_missions|test_campaign_index|test_cob_inspect|test_cob_inspect_all|test_asset_validate_units|test_asset_validate_mission_units)$"
