# Which tests a change has to run, decided by which files it touches.
#
# This file is the policy. scripts/test-tier.py only reads it and prints the
# commands, so changing what a branch has to run is a commit and a review,
# never a decision an agent makes while it is in a hurry. The prose that
# explains the reasoning is in docs/testing-tiers.md.
#
# How a tier is decided:
#   tier = the highest tier over every changed file
#   four or more distinct tier 1 entries escalate to tier 2
#   a path that matches nothing is tier 2
#
# Every ui entry is a pair [filter, expected_total]. The filter is a plain
# substring match against the case name, which means a typo matches nothing
# and prints "Results: 0 passed, 0 failed, 0 total". The expected total is
# what makes a targeted run evidence rather than theatre.
# scripts/test_test_tier.py checks every one of these counts against
# src/ui/test_ui_screens.c, so a case added or renamed breaks the rules file
# rather than quietly dropping out of coverage.

schema = 1

[policy]
# Four distinct tier 1 entries in one change are close to the whole binary
# anyway, and cross subsystem interaction is exactly what a named case list
# cannot see.
escalate_at_distinct_entries = 4
# The declared test count is read from this file at run time, so the staleness
# check never has a stale number baked into it.
test_count_source = "src/CMakeLists.txt"
default_config = "Release"


# ---------------------------------------------------------------------------
# Tier 0. No tests, no lock take. Commit, push, done. The pre-commit hook and
# the licence scan in CI are the only checks and both take seconds.
# ---------------------------------------------------------------------------
[tier0]
paths = [
  "docs/**",
  "README.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "CLAUDE.md",
  "CLAUDE.local.md",
  "LICENSE",
  ".github/ISSUE_TEMPLATE/**",
  ".github/PULL_REQUEST_TEMPLATE.md",
  ".github/dependabot.yml",
  ".coderabbit.yaml",
  ".gitattributes",
  ".gitignore",
  "web/CNAME",
  "web/favicon.png",
  "web/og.jpg",
  "web/scroll-pick.jpg",
  "web/scroll-ready.jpg",
]
# Deliberately not here, because they are executable and they change what gets
# built or how it gets run: .github/workflows/*.yml, .githooks/*, scripts/*,
# web/shell.html. Those fall through to tier 2.


