[[tier1]]
name = "test source"
# A test source builds one executable and nothing ships from it. The targets
# are worked out from src/CMakeLists.txt at run time rather than listed here,
# so a new test file needs no rule and a retargeted one cannot go stale.
# This entry wins over the tier 2 directory rules, which are about product
# code. src/ui/test_ui_screens.c is not here, it is the harness set below.
kind = "own-target"
paths = ["src/**/test_*.c"]
ui = []


# ---------------------------------------------------------------------------
# Tier 2. The full suite on both data layouts, two lock takes.
# ---------------------------------------------------------------------------
[tier2]
paths = [
  # Any header at all. A leaf header pulls in more targets than its name
  # suggests, because the include graph fans out further than the filename.
  "include/**",
  # memory.c is compiled into 35 of the registered tests, util.c and io.c
  # nearly as many, and the archive reader sits under everything that loads
  # data.
  "src/core/**",
  # The tick loop, the world and unit simulation. Almost every ui case boots
  # a map and ticks it.
  "src/main.c",
  "src/platform/**",
  "third_party/**",
  "src/game/world.c",
  "src/game/ai.c",
  "src/game/ai_influence.c",
  "src/game/ai_plan.c",
  "src/game/maps.c",
  "src/game/tnt.c",
  "src/game/map_fingerprint.c",
  "src/game/features.c",
  "src/game/sim_rand.c",
  "src/game/sim_hash.c",
  "src/render/units.c",
  "src/render/palette.c",
  "src/render/pal_lookup.c",
  "src/render/cob.c",
  "src/render/cob_vm.c",
  "src/render/terrain.c",
  "src/render/ui.c",
  "src/render/font.c",
  "src/render/tex_atlas.c",
  "src/render/tak_gpu.c",
  "src/render/debug_panel.c",
  "src/render/cursor.c",
  "src/render/bink_player.c",
  "src/ui/ingame.c",
  "src/ui/loading.c",
  "src/ui/translate.c",
  "src/sound/music.c",
  # Build and continuous integration files, because they change what is
  # compiled and how it is run.
  "CMakeLists.txt",
  "src/CMakeLists.txt",
  "CMakePresets.json",
  "vcpkg.json",
  "cmake/**",
  ".github/workflows/**",
  ".githooks/**",
  "scripts/**",
  "web/shell.html",
]
# Everything else lands here too. The catch all is what makes a new file safe.

[tier2.harness]
# A change confined to these cannot alter shipped behaviour, only the harness
# that measures it. Full suite, but one data layout and one lock take, so
# adding coverage does not cost double. Confined means these files and nothing
# else. Mixed with any product file the change is an ordinary tier 2.
paths = [
  "include/test_framework.h",
  "include/test_hpi_builder.h",
  "src/ui/test_ui_screens.c",
]
